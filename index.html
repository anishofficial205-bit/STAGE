<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect x=%224%22 y=%2218%22 width=%2224%22 height=%228%22 rx=%221%22 fill=%22%23d4f542%22/%3E%3Cpath d=%22M6 18V6h20v12h-4V10H10v8z%22 fill=%22%239a9ea5%22/%3E%3C/svg%3E" />
    <title>Stage Builder</title>
    <script>
      try {
        var t = localStorage.getItem('stage-builder:theme');
        document.documentElement.dataset.theme = t === 'light' || t === 'dark' ? t : matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      } catch (e) {
        document.documentElement.dataset.theme = 'dark';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
